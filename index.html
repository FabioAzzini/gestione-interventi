<!doctype html><html lang="it"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gestione Interventi</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#eef1f4;font:14px Arial;color:#263238}.app{max-width:1200px;margin:auto;padding:18px}
header,.panel{background:#fff;border-radius:14px;box-shadow:0 3px 14px #0001;padding:16px}header{display:flex;align-items:center;justify-content:space-between;gap:15px;margin-bottom:16px}header img{max-width:430px;width:58%}
button{border:0;border-radius:8px;padding:10px 13px;font-weight:bold;cursor:pointer}.primary{background:#168653;color:white}.blue{background:#3159b7;color:white}.secondary{background:#e9edf1}.danger{background:#e84a5b;color:white}
.actions{display:flex;gap:7px;flex-wrap:wrap}.grid{display:grid;grid-template-columns:330px 1fr;gap:16px}h2{margin:0 0 14px}h3{margin:16px 0 8px}
label{display:block;font-size:12px;font-weight:bold;color:#68727a;margin:9px 0 4px}input,select,textarea{width:100%;padding:9px;border:1px solid #d5dbe0;border-radius:7px;font:inherit}textarea{min-height:100px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}.full{grid-column:1/-1}.search{margin-bottom:10px}
.item{padding:12px;border:1px solid #d8dde1;border-radius:10px;margin:8px 0;cursor:pointer}.item.sel{border:2px solid #168653}.item.done{background:#e8f7ee}.item.prog{background:#eef5ff}
.client{font-weight:bold;font-size:16px}.meta{font-size:12px;color:#66727a;margin-top:4px}.badge{float:right;padding:4px 7px;border-radius:15px;font-size:10px;font-weight:bold;background:#e8edf1}
.work{display:flex;gap:8px;align-items:flex-start;border-bottom:1px solid #edf0f2;padding:8px 0}.work input{width:auto}.work span{flex:1}
.info{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:12px 0}.box{background:#f4f6f8;padding:9px;border-radius:8px}.box small{display:block;color:#727d84;font-size:10px;font-weight:bold}
.section{border-top:1px solid #dfe3e6;margin-top:16px;padding-top:10px}.empty{text-align:center;color:#77838b;padding:35px}
@media(max-width:850px){.grid{grid-template-columns:1fr}header{flex-direction:column}header img{width:100%}.info{grid-template-columns:1fr 1fr}}
@media print{body{background:white}.app{padding:0}.left{display:none}header{box-shadow:none}.panel{box-shadow:none}.print{display:none!important}}

<style>
.ups-card{border:1px solid #cfd8e3;border-radius:12px;padding:12px;margin:10px 0;background:#fbfcfe}
.ups-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.ups-name{font-weight:800;font-size:16px;color:#173c91}
.ups-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.ups-box{background:#f1f5f9;border-radius:8px;padding:8px}
.ups-box small{display:block;color:#64748b;font-size:10px;font-weight:700}
.ups-box strong{display:block;margin-top:3px;font-size:13px}
.ups-battery{margin-top:10px;background:#fff8df;border:1px solid #f3d37a;border-radius:9px;padding:10px}
.ups-battery-title{font-weight:800;color:#8a5a00;margin-bottom:6px}
.import-box{background:#eef2ff;border:1px dashed #6366f1;border-radius:11px;padding:12px;margin-top:10px}
@media(max-width:650px){.ups-grid{grid-template-columns:1fr}}
</style>

<div class="grid"><aside class="panel left"><h2>Interventi</h2>
<input id="search" class="search" placeholder="🔎 Cerca cliente o luogo" oninput="lista()">
<select id="filter" onchange="lista()"><option value="">Tutti gli stati</option><option>Aperto</option><option>Programmato</option><option>In corso</option><option>Completato</option></select>

<script>
const KEY="interventi_ups_lorenzi";let db=JSON.parse(localStorage.getItem(KEY)||"[]"),sel=null;
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
const date=d=>d?d.split("-").reverse().join("/"):"—";
function save(){localStorage.setItem(KEY,JSON.stringify(db));lista()}
function nuovo(){let x={id:Date.now(),date:new Date().toISOString().slice(0,10),time:"08:30",client:"",location:"",address:"",contact:"",phone:"",status:"Aperto",room:"",works:[],notes:"",ups:[]};db.unshift(x);sel=x.id;save();editor()}
function lista(){let q=(search.value||"").toLowerCase(),f=filter.value;
 let a=db.filter(x=>(!f||x.status==f)&&(`${x.client} ${x.location} ${x.room}`).toLowerCase().includes(q));
 listaEl=document.getElementById("lista");listaEl.innerHTML=a.length?a.map(x=>`<div class="item ${x.id==sel?"sel":""} ${x.status=="Completato"?"done":x.status=="In corso"?"prog":""}" onclick="seleziona(${x.id})"><span class="badge">${esc(x.status)}</span><div class="client">${esc(x.client||"Nuovo cliente")}</div><div class="meta">📅 ${date(x.date)} · ⏰ ${esc(x.time)}</div><div class="meta">📍 ${esc(x.location||"Luogo non indicato")}</div>${x.address?`<div class="meta">🏠 ${esc(x.address)}</div>`:""}</div>`).join(""):'<div class="empty">Nessun intervento</div>'}
function seleziona(id){sel=id;lista();editor()}
function editor(){let x=db.find(z=>z.id==sel),e=document.getElementById("editor");if(!x){e.innerHTML='<div class="empty"><h2>Nessun intervento</h2><button class="primary" onclick="nuovo()">＋ Nuovo intervento</button></div>';return}
if(!x.ups)x.ups=[];
e.innerHTML=`<div class="actions print"><button class="danger" onclick="elimina()">🗑 Elimina</button></div><h2>Intervento</h2><div class="meta">Puoi importare direttamente il rapportino HTML generato dal collega.</div>
<div class="form"><div><label>Data</label><input id="date" type="date" value="${esc(x.date)}"></div><div><label>Ora</label><input id="time" type="time" value="${esc(x.time)}"></div>
<div class="full"><label>Cliente</label><input id="client" value="${esc(x.client)}"></div><div><label>Luogo / sede</label><input id="location" value="${esc(x.location)}"></div>
<div><label>Stato</label><select id="status">${["Aperto","Programmato","In corso","Completato"].map(s=>`<option ${x.status==s?"selected":""}>${s}</option>`).join("")}</select></div>
<div><label>Riferimento sul posto</label><input id="contact" value="${esc(x.contact)}"></div><div><label>Telefono</label><input id="phone" value="${esc(x.phone)}"></div>
<div class="full"><label>Sala / reparto</label><input id="room" value="${esc(x.room)}"></div></div>

<div class="section"><h3>⚡ Apparecchiature UPS</h3>
<div class="import-box">
  <div style="font-weight:800;color:#173c91">Importa dati dal rapportino UPS del collega</div>
  <div class="meta" style="margin:5px 0 9px">Seleziona il file HTML generato dal Rapportino UPS. Verranno importati cliente, indirizzo, referente, telefono e i dati delle apparecchiature UPS, anche per più UPS.</div>
  <input id="ups-file" type="file" accept=".html,text/html" style="display:none" onchange="importaRapportoUPS(this)">
  <button class="secondary print" onclick="document.getElementById('ups-file').click()">📥 Importa rapportino HTML</button>
</div>
<div id="ups-list-detail">${renderUPS(x.ups)}</div>
</div>

<div class="section"><h3>Lavori da eseguire</h3><div id="works">${x.works.length?x.works.map((w,i)=>`<div class="work"><input type="checkbox" ${w.done?"checked":""} onchange="toggle(${i})"><span>${esc(w.text)}</span><button class="danger print" onclick="removeWork(${i})">×</button></div>`).join(""):'<div class="meta">Nessun lavoro inserito.</div>'}</div>
<div class="form print"><input id="newwork" class="full" placeholder="Nuovo lavoro"><button class="secondary" onclick="addWork()">＋ Aggiungi lavoro</button></div></div>
<div class="section"><h3>Note / intervento effettuato</h3><textarea id="notes">${esc(x.notes)}</textarea></div>
<div class="actions print" style="margin-top:15px"><button class="primary" onclick="salva()">💾 Salva intervento</button><button class="blue" onclick="print()">🖨 Stampa scheda</button></div>`;
}

function renderUPS(arr){
  if(!arr || !arr.length) return '<div class="meta" style="margin-top:10px">Nessuna apparecchiatura importata.</div>';
  return arr.map((u,i)=>`<div class="ups-card">
    <div class="ups-head">
      <div><div class="ups-name">⚡ UPS ${i+1} · ${esc(u.model||"Modello non indicato")}</div><div class="meta">${esc(u.location||"Posizione non indicata")}</div></div>
      <button class="danger print" style="padding:6px 9px" onclick="removeUPS(${i})">×</button>
    </div>
    <div class="ups-grid">
      <div class="ups-box"><small>Numero di serie</small><strong>${esc(u.serial||"—")}</strong></div>
      <div class="ups-box"><small>Potenza</small><strong>${esc(u.power||"—")} ${u.power?"VA":""}</strong></div>
      <div class="ups-box"><small>M.I.S.</small><strong>${esc(u.mis||"—")}</strong></div>
      <div class="ups-box"><small>By Pass esterno</small><strong>${esc(u.bypass||"—")}</strong></div>
    </div>
    <div class="ups-battery">
      <div class="ups-battery-title">🔋 Batterie</div>
      <div class="ups-grid">
        <div class="ups-box"><small>Numero / configurazione</small><strong>${esc(u.batteryCount||"—")}</strong></div>
        <div class="ups-box"><small>Tipo / Marca</small><strong>${esc(u.batteryType||"—")}</strong></div>
        <div class="ups-box"><small>Installazione</small><strong>${esc(u.batteryDate||"—")}</strong></div>
        <div class="ups-box"><small>Materiale sostituito</small><strong>${esc(u.materialReplaced||"—")}</strong></div>
      </div>
    </div>
    ${(u.components||"")?`<div class="meta" style="margin-top:9px"><b>Componenti:</b> ${esc(u.components)}</div>`:""}
    ${(u.note||"")?`<div class="note" style="margin-top:9px">${esc(u.note)}</div>`:""}
  </div>`).join("");
}

function importaRapportoUPS(input){
  const file=input.files && input.files[0]; if(!file)return;
  const reader=new FileReader();
  reader.onload=()=>{
    try{
      const doc=new DOMParser().parseFromString(reader.result,"text/html");
      const node=doc.querySelector("#__saved_data__");
      if(!node) throw new Error("Il file non contiene i dati salvati del rapportino UPS.");
      const D=JSON.parse(node.textContent||node.innerHTML||"");
      const x=db.find(z=>z.id==sel); if(!x.ups)x.ups=[];

      // Dati cliente
      if(D.cliente) x.client=String(D.cliente).trim();
      if(D.indirizzo) x.address=String(D.indirizzo).trim();
      const loc=[D.localita,D.provincia].filter(Boolean).join(" – ");
      if(loc) x.location=String(loc).trim();
      if(D.referente) x.contact=String(D.referente).trim();
      if(D.telefono) x.phone=String(D.telefono).trim();

      // Apparecchiature UPS
      const ids=[...new Set(Object.keys(D).map(k=>{
        const m=k.match(/^u_mod_(.+)$/); return m?m[1]:null
      }).filter(Boolean))];
      if(!ids.length) throw new Error("Nel rapportino non sono presenti apparecchiature UPS.");

      ids.forEach(id=>{
        const get=k=>D[k+"_"+id]??"";
        const parts=[];
        Object.keys(D).forEach(k=>{
          const m=k.match(new RegExp("^p_des_"+id+"_(\\\\d+)$"));
          if(m && D[k]) parts.push(D[k]+(D["p_qty_"+id+"_"+m[1]]?(" × "+D["p_qty_"+id+"_"+m[1]]):""));
        });
        const components=[
          get("u_cond_cc")&&("Condensatori CC: "+get("u_cond_cc")),
          get("u_cond_ca")&&("Condensatori CA: "+get("u_cond_ca")),
          get("u_raff")&&("Ventilatori: "+get("u_raff")),
          parts.length&&("Materiali: "+parts.join(", "))
        ].filter(Boolean).join(" · ");

        x.ups.push({
          sourceFile:file.name, location:get("u_loc"), model:get("u_mod"),
          serial:get("u_sn"), power:get("u_kva"), mis:get("u_mis"),
          bypass:get("u_bypass"), batteryCount:get("u_nbatt"),
          batteryType:get("u_tipobatt"), batteryDate:get("u_dbatt2"),
          materialReplaced:get("u_matsost"), components, note:get("u_note")
        });
      });

      save(); editor();
      alert("Importati cliente, contatti e "+ids.length+" apparecchiatura/e UPS.");
    }catch(err){alert("Importazione non riuscita: "+err.message)}
    input.value="";
  };
  reader.readAsText(file);
}

function removeUPS(i){const x=db.find(z=>z.id==sel);x.ups.splice(i,1);save();editor()}

function salva(){let x=db.find(z=>z.id==sel);["date","time","client","location","address","status","contact","phone","room","notes"].forEach(k=>x[k]=document.getElementById(k).value.trim());save();editor()}
function addWork(){let v=document.getElementById("newwork").value.trim();if(!v)return;db.find(x=>x.id==sel).works.push({text:v,done:false});editor()}
function toggle(i){let x=db.find(x=>x.id==sel);x.works[i].done=!x.works[i].done;save()}
function removeWork(i){db.find(x=>x.id==sel).works.splice(i,1);editor()}
function elimina(){if(confirm("Eliminare questo intervento?")){db=db.filter(x=>x.id!=sel);sel=db[0]?.id||null;save();editor()}}
function esporta(){let a=document.createElement("a");a.href=URL.createObjectURL(new Blob([JSON.stringify(db,null,2)],{type:"application/json"}));a.download="interventi_backup.json";a.click()}
function importa(){let i=document.createElement("input");i.type="file";i.accept=".json";i.onchange=e=>{let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);sel=db[0]?.id||null;save();editor()}catch{alert("File non valido")}};r.readAsText(e.target.files[0])};i.click()}
